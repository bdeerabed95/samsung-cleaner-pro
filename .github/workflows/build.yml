name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install cordova
      run: npm install -g cordova
    
    - name: Create Cordova project
      run: |
        cordova create app com.samsung.cleaner.pro "Samsung Cleaner Pro"
        cd app
        cordova platform add android
        cp ../index.html www/
        cp ../manifest.json www/ 2>/dev/null || true
        cp ../service-worker.js www/ 2>/dev/null || true
    
    - name: Build APK
      run: |
        cd app
        cordova build android
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
