name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create www directory
      run: |
        mkdir -p www
        cp -r index.html manifest.json service-worker.js css js icons www/ 2>/dev/null || true
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Capacitor 6
      run: |
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Samsung Cleaner Pro" "com.samsung.cleaner.pro" --web-dir=www
        npx cap add android
    
    - name: Add Kotlin Files
      run: |
        mkdir -p android/app/src/main/java/com/samsung/cleaner/pro
        cp CleanerServerService.kt android/app/src/main/java/com/samsung/cleaner/pro/
        cp CleanerBridge.kt android/app/src/main/java/com/samsung/cleaner/pro/
        
        cd android/app
        sed -i 's|dependencies {|dependencies {\n    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"\n    implementation "androidx.core:core-ktx:1.12.0"|' build.gradle
        cd ../..
    
    - name: Add Permissions and Service
      run: |
        cd android/app/src/main
        sed -i 's|</manifest>|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n</manifest>|' AndroidManifest.xml
        
        sed -i 's|</application>|<service android:name=".CleanerServerService" android:enabled="true" android:exported="false" android:foregroundServiceType="dataSync" />\n    </application>|' AndroidManifest.xml
        cd ../../..
    
    - name: Sync Files
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
