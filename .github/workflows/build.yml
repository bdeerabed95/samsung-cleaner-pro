name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Create www directory
      run: |
        mkdir -p www
        cp -r index.html manifest.json service-worker.js css js icons www/ 2>/dev/null || true
        ls -la www/
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Capacitor and Plugins
      run: |
        npm init -y
        npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
        npm install @capacitor/permissions @capacitor/filesystem
    
    - name: Initialize Capacitor
      run: |
        npx cap init "Samsung Cleaner Pro" "com.samsung.cleaner.pro" --web-dir=www
        npx cap add android
    
    - name: Add Storage Permissions
      run: |
        cd android/app/src/main
        sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.CLEAR_APP_CACHE" />\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n    <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />|' AndroidManifest.xml
        cd ../../..
    
    - name: Sync Files
      run: npx cap sync android
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
